name: macOS Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install cmake ninja

      - name: Configure (CMake + Ninja)
        shell: bash
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build build

      - name: List built artefacts (sanity)
        shell: bash
        run: |
          ls -la build/AlphaJuno2Editor_artefacts || true
          ls -la build/AlphaJuno2EditorPlugin_artefacts || true

