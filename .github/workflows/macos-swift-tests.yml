name: macOS Swift Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftPM tests
        shell: bash
        run: |
          cd BlackAlphaJunoEditor
          swift test -v

      - name: Build app (Release)
        shell: bash
        run: |
          cd BlackAlphaJunoEditor
          swift build -c release -v

